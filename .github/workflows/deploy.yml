name: Deploy QFomeAI to Cloud Run

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build -t us-west1-docker.pkg.dev/flutterflow-buscando-sheets/cloud-run-source-deploy/qfomeai.com/qfomeai:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push us-west1-docker.pkg.dev/flutterflow-buscando-sheets/cloud-run-source-deploy/qfomeai.com/qfomeai:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy qfomeai \
            --image us-west1-docker.pkg.dev/flutterflow-buscando-sheets/cloud-run-source-deploy/qfomeai.com/qfomeai:${{ github.sha }} \
            --region us-west1 \
            --clear-annotations run.googleapis.com/sources \
            --platform managed
